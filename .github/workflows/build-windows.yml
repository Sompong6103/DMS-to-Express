name: Build Windows EXE

# สั่ง build เมื่อ: push ขึ้น main, ติด tag ขึ้นต้นด้วย v (เช่น v1.0), หรือกดปุ่ม Run workflow เอง
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # ใช้สร้าง Release ตอนติด tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller xlrd

      - name: Build ExpressImport.exe
        run: pyinstaller --onefile --console --name ExpressImport --hidden-import xlrd express_gui.py

      - name: Upload artifact (ดาวน์โหลดได้จากหน้า Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ExpressImport-windows
          path: dist/ExpressImport.exe

      - name: Attach to Release (เฉพาะตอนติด tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExpressImport.exe
