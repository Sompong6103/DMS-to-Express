name: Build Windows EXE

# สั่ง build เมื่อ: push ขึ้น main, ติด tag ขึ้นต้นด้วย v (เช่น v1.0), หรือกดปุ่ม Run workflow เอง
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # ใช้สร้าง Release ตอนติด tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (x86) — รองรับ Windows 7/10/11
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==5.13.2" "xlrd==2.0.1" "openpyxl==3.1.3" "et-xmlfile==1.1.0"

      - name: Build ExpressImport.exe (32-bit, รันได้ทั้ง Win7/10/11)
        run: pyinstaller --onefile --console --name ExpressImport --hidden-import xlrd --collect-all openpyxl express_gui.py

      - name: Patch PE header -> minimum OS 6.1 (Windows 7)
        shell: python
        run: |
          import struct
          f = "dist/ExpressImport.exe"
          d = bytearray(open(f, "rb").read())
          pe = struct.unpack_from("<I", d, 0x3C)[0]
          assert d[pe:pe+4] == b"PE\x00\x00", "not a PE file"
          machine = struct.unpack_from("<H", d, pe+4)[0]
          opt = pe + 24
          osv = struct.unpack_from("<H", d, opt+40)[0]
          ssv = struct.unpack_from("<H", d, opt+48)[0]
          print(f"machine=0x{machine:x} (0x14c=32bit,0x8664=64bit)  before: OSver={osv} SubsysVer={ssv}")
          struct.pack_into("<H", d, opt+40, 6)   # MajorOperatingSystemVersion
          struct.pack_into("<H", d, opt+42, 1)   # MinorOperatingSystemVersion
          struct.pack_into("<H", d, opt+48, 6)   # MajorSubsystemVersion
          struct.pack_into("<H", d, opt+50, 1)   # MinorSubsystemVersion
          open(f, "wb").write(d)
          print("patched -> minimum OS/Subsystem = 6.1 (Windows 7)")

      - name: Create launchers (แชร์ LAN เป็นค่าเริ่มต้น + เฉพาะเครื่องนี้)
        shell: pwsh
        run: |
          "@echo off`r`ncd /d `"%~dp0`"`r`nExpressImport.exe`r`npause" | Set-Content dist/เปิดโปรแกรม-แชร์LAN.bat -Encoding utf8
          "@echo off`r`ncd /d `"%~dp0`"`r`nExpressImport.exe --local`r`npause" | Set-Content dist/เปิดโปรแกรม-เฉพาะเครื่องนี้.bat -Encoding utf8

      - name: Upload artifact (ดาวน์โหลดได้จากหน้า Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ExpressImport-windows
          path: dist/*

      - name: Attach to Release (เฉพาะตอนติด tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
